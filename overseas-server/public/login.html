<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · SubFlux</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f16; --panel:#121826; --line:#243049; --text:#e6edf7; --muted:#8b9bb4; --accent:#4f8cff; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(1200px 600px at 20% -10%, #17233b 0%, var(--bg) 55%); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; padding:24px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:0 24px 80px rgba(0,0,0,.45); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .mark { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#4f8cff,#8b5cf6); display:grid; place-items:center; font-weight:700; }
  h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  p.sub { margin:4px 0 0; color:var(--muted); font-size:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:16px 0 6px; }
  input { width:100%; height:40px; border-radius:10px; border:1px solid var(--line); background:#0d1420; color:var(--text); padding:0 12px; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,140,255,.15); }
  button { width:100%; height:40px; margin-top:20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .error { display:none; margin-top:14px; padding:9px 12px; border-radius:9px; background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35); color:#ffb4b4; font-size:12px; }
  .error.show { display:block; }
  .foot { margin-top:18px; color:var(--muted); font-size:11px; text-align:center; }
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <div class="brand">
      <span class="mark">S</span>
      <div>
        <h1>SubFlux</h1>
        <p class="sub">订阅汇聚面板 · 请先登录</p>
      </div>
    </div>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="pass">密码</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required />
    <button id="submit" type="submit">登录</button>
    <div class="error" id="error"></div>
    <div class="foot">账号由容器环境变量 SUBFLUX_USERNAME / SUBFLUX_PASSWORD 配置</div>
  </form>
<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const button = document.getElementById('submit');
  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.remove('show');
    button.disabled = true;
    button.textContent = '登录中…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          pass: document.getElementById('pass').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        window.location.replace('/');
        return;
      }
      showError(data.error || `登录失败（HTTP ${res.status}）`);
    } catch (err) {
      showError('无法连接服务，请检查网络后重试');
    } finally {
      button.disabled = false;
      button.textContent = '登录';
    }
  });
</script>
</body>
</html>
